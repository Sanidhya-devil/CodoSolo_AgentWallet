[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules", "../../starter-kit/contracts/lib"]
evm_version = "shanghai"
solc_version = "0.8.24"
optimizer = false
via_ir = false
cbor_metadata = false
bytecode_hash = "none"

remappings = [
    "@openzeppelin/contracts/=../../starter-kit/contracts/lib/openzeppelin-contracts/contracts/",
    "forge-std/=../../starter-kit/contracts/lib/forge-std/src/"
]
